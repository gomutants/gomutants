name: Tests

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'

  test:
    needs: changes
    # Gate logic mirrors security.yml: always() lets push/schedule events
    # run when `changes` is skipped; on PRs, only run when Go sources changed.
    if: |
      always() &&
      (github.event_name != 'pull_request' || needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.1"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test -short -race ./...

      - name: Integration tests
        run: go test -run TestIntegration -v -timeout 5m .

  coverage:
    needs: changes
    if: |
      always() &&
      (github.event_name != 'pull_request' || needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.1"

      - name: Run tests with coverage
        # Scope to internal/ to match where mutation testing runs and to
        # exclude main.go (heavy on signal/CLI plumbing that's not unit-
        # testable) and testdata/ (intentionally weak fixtures). Held at
        # 100% — every defensive branch in this scope has a dedicated
        # test.
        run: go test -short -coverprofile=coverage.out ./internal/...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Check coverage threshold
        run: |
          set -euo pipefail

          TOTAL_COV=$(awk -F'[ ]' 'NR > 1 {
            total += $(NF-1)
            if ($NF > 0) covered += $(NF-1)
          } END {
            printf "%.4f", (total > 0 ? covered * 100 / total : 0)
          }' coverage.out)

          REQUIRED=100
          echo "Total coverage: ${TOTAL_COV}% (required: ${REQUIRED}%)"

          if [ "$(echo "${TOTAL_COV} < ${REQUIRED}" | bc -l)" -eq 1 ]; then
            echo "::error::Coverage ${TOTAL_COV}% is below required ${REQUIRED}%"
            exit 1
          fi
