name: Security & Static Analysis

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # every Monday at 06:00 UTC

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # paths-filter calls the PR listFiles API; needs read access.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
            workflows:
              - '.github/workflows/**'

  govulncheck:
    needs: changes
    # Gate logic:
    #   - always(): required because `needs: changes` would otherwise
    #     skip this job when changes itself is skipped (non-PR events).
    #   - github.event_name != 'pull_request': force-run on push/schedule.
    #   - needs.changes.outputs.code == 'true': on PRs, only run when
    #     Go sources or go.mod/go.sum changed.
    if: |
      always() &&
      (github.event_name != 'pull_request' || needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Run govulncheck
        run: govulncheck ./...

  zizmor:
    needs: changes
    if: |
      always() &&
      (github.event_name != 'pull_request' || needs.changes.outputs.workflows == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Run zizmor directly rather than via zizmor-action: the action
      # uploads SARIF via codeql-action/upload-sarif which needs
      # code-scanning enabled on the repo and an `actions: read` token
      # scope we'd rather not grant. Plain CLI exits non-zero on
      # findings, which is all we need for a PR gate. pipx is
      # preinstalled on ubuntu-latest runners.
      - name: Run zizmor
        run: pipx run zizmor==1.22.0 .github/workflows/

  golangci-lint:
    needs: changes
    if: |
      always() &&
      (github.event_name != 'pull_request' || needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          # v9 of the action only supports golangci-lint v2+.
          version: v2.1.6
          # The v2.1.6 prebuilt binary was compiled with Go 1.24 and
          # refuses to lint projects targeting a newer Go version.
          # goinstall rebuilds golangci-lint with the toolchain from
          # the setup-go step above (go.mod's 1.26.10), so the linter's
          # Go version matches the target.
          install-mode: goinstall
